services:
  - type: web
    name: whatsapp-reminder-agent
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && (cd bridge && npm install --production || true)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: WHATSAPP_GATEWAY_TYPE
        value: meta
      - key: DEFAULT_COUNTRY_CODE
        value: "+91"
